name: habitwise
description: Private, offline-first craving support that learns without judgment.
publish_to: none
version: 1.2.0+3

environment:
  sdk: ^3.12.0

dependencies:
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  flutter_timezone: ^5.1.0
  go_router: ^17.3.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^13.2.1
  timezone: ^0.11.1
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/images/
    - assets/mascot/body/
    - assets/mascot/layers/
  fonts:
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
